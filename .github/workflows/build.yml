name: build
on: [ push, pull_request ]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ clang++, g++ ]
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
        env:
          CXX: ${{ matrix.compiler }}
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: cd build && ctest --output-on-failure
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: cd build && ctest --output-on-failure
      - name: Build unsigned package
        run: APP_IDENTITY=- INSTALLER_IDENTITY=- macos/build-pkg.sh
